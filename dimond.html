<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة الجواهر</title>

  <!-- مكان كود AdSense (بعد الموافقة) -->
  <!--
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX"
    crossorigin="anonymous"></script>
  -->

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
    }

    .gems {
      font-size: 40px;
      color: #38bdf8;
      margin: 20px 0;
    }

    button {
      background: #38bdf8;
      color: black;
      border: none;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .ad {
      margin: 30px 0;
      background: #334155;
      padding: 20px;
      border-radius: 10px;
      color: #cbd5f5;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>💎 لعبة الجواهر</h1>
    <p>اضغط الزر لتحصل على عدد جواهر عشوائي</p>

    <div id="gems" class="gems">---</div>

    <button onclick="generateGems()">احصل على الجواهر</button>

    <!-- مكان الإعلان -->
    <div class="ad">
      إعلان هنا
    </div>
  </div>

  <script>
    function generateGems() {
      const gems = Math.floor(Math.random() * (5000 - 1000 + 1)) + 1000;
      document.getElementById("gems").innerText = gems + " 💎";
    }
  </script>

</body>
</html>
